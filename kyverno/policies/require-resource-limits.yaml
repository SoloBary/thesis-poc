apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: Enforce
  rules:
    - name: require-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Resource limits are required. Define CPU and memory limits for all containers."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: ?*
                    memory: ?*
